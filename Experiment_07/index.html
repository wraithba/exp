<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Directory</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf7ff;color:#1d1b20;font:16px Arial,sans-serif}header{min-height:64px;display:flex;align-items:center;gap:20px;padding:12px 20px;font-size:22px;background:#fdf7ff}main{padding:16px;max-width:1100px;margin:auto}button{border:0;border-radius:24px;background:#eaddff;color:#6750a4;padding:11px 24px;margin:8px 6px 8px 0;cursor:pointer;font-size:14px}button:disabled{opacity:.5;cursor:wait}input:not([type=checkbox]):not([type=range]),select,textarea{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid #79747e;padding:16px 4px;font:inherit;margin-bottom:12px}input[type=range]{width:100%;accent-color:#6750a4}input[type=checkbox]{accent-color:#6750a4}label{display:block;margin:12px 0;color:#49454f}article{background:#f2ecf4;border-radius:12px;padding:16px;margin:12px 0;white-space:pre-line}article p{margin:8px 0;color:#49454f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid article{text-align:center;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center}.row{display:flex;align-items:center;justify-content:space-between}#message{padding:8px;white-space:pre-line}#message:empty{display:none}h2{font-size:26px;font-weight:400}h3{font-size:20px;font-weight:400}small{display:block;color:#49454f}a{color:#6750a4}details{padding:12px;background:#f2ecf4;margin-bottom:16px}summary{cursor:pointer}.back{font-size:24px;padding:4px 12px;background:transparent;color:#1d1b20;margin:0}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#322f35;color:white;padding:14px 24px;border-radius:4px}dialog{border:0;border-radius:16px;background:#fdf7ff;max-width:90%;width:400px}@media(max-width:631px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:391px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><span id="back"></span><span id="title">Employee Directory</span></header><main id="app"></main><script type="module">const $=id=>document.getElementById(id);const value=id=>$(id).value.trim();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(t){$('message').textContent=t}function card(title,text=''){return `<article><div>${esc(title)}</div><p>${esc(text)}</p></article>`}function field(id,label,type='text'){return `<label>${label}<input id="${id}" type="${type}" aria-label="${label}"></label>`}function select(id,label,options){return `<label>${label}<select id="${id}">${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`}function button(id,text){return `<button id="${id}">${text}</button>`}function shell(title,body){$('title').textContent=title;$('app').innerHTML=body+'<div id="message" role="status"></div>'}function toast(t){const n=document.createElement('div');n.id='toast';n.role='status';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),3500)}
const configKey='flutter-lab-firebase-config';
$('app').innerHTML=`<details open id="setup"><summary>Firebase configuration</summary><p>Paste the Firebase web app configuration as JSON. Use the same project as Flutter. Enable Firestore and, for Experiment 10, Email/Password Authentication. Run this page through localhost.</p><textarea id="config" rows="7" aria-label="Firebase web configuration" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea><button id="connect">Connect Firebase</button></details><section id="content"></section><div id="message" role="status"></div>`;
try{$('config').value=localStorage.getItem(configKey)||''}catch{}
let db,auth,api,authApi,busy=false,unsubscribe;
async function perform(action){if(busy)return;busy=true;message('Working...');document.querySelectorAll('#content button').forEach(b=>b.disabled=true);try{await action();message('Completed successfully')}catch(e){message('Operation failed: '+e.message)}finally{busy=false;document.querySelectorAll('#content button').forEach(b=>b.disabled=false)}}
$('connect').onclick=async()=>{try{const config=JSON.parse($('config').value);if(!config.apiKey||!config.projectId||!config.appId)throw Error('Enter apiKey, projectId and appId');const core=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js');api=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js');authApi=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js');const app=core.getApps().length?core.getApp():core.initializeApp(config);db=api.getFirestore(app);auth=authApi.getAuth(app);try{localStorage.setItem(configKey,JSON.stringify(config))}catch{}if(unsubscribe)unsubscribe();start();$('setup').open=false;message('Connected to Firebase')}catch(e){message('Firebase setup failed: '+e.message)}};
function start(){const ref=api.collection(db,'employees');$('content').innerHTML=field('id','Employee ID')+field('name','Employee name')+select('department','Department',['Engineering','HR','Sales'])+button('save','Add employee')+field('search','Search name or ID')+select('filter','Filter department',['All','Engineering','HR','Sales'])+'<div id="list"></div>';let rows=[];function render(){const shown=rows.filter(d=>(d.id+' '+d.name).toLowerCase().includes(value('search').toLowerCase())&&(value('filter')==='All'||d.department===value('filter')));$('list').innerHTML=shown.map(d=>`<article><div class="row"><span>${esc(d.name)} (${esc(d.id)})</span><button data-id="${esc(d.id)}" aria-label="Delete ${esc(d.name)}">Delete</button></div><p>Department: ${esc(d.department)}</p></article>`).join('')||'<p>No employees found</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>perform(()=>api.deleteDoc(api.doc(ref,b.dataset.id))))}$('search').oninput=render;$('filter').onchange=render;$('save').onclick=()=>{if(!value('id')||value('id').includes('/')||!value('name'))return message('Enter a valid ID and name');const doc=api.doc(ref,value('id')),data={name:value('name'),department:value('department')};perform(()=>api.runTransaction(db,async tx=>{if((await tx.get(doc)).exists())throw Error('Employee ID already exists');tx.set(doc,data)}))};unsubscribe=api.onSnapshot(ref,s=>{rows=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>message('Database error: '+e.message))}</script></body></html>
