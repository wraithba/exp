<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLite Student Records</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf7ff;color:#1d1b20;font:16px Arial,sans-serif}header{min-height:64px;display:flex;align-items:center;gap:20px;padding:12px 20px;font-size:22px;background:#fdf7ff}main{padding:16px;max-width:1100px;margin:auto}button{border:0;border-radius:24px;background:#eaddff;color:#6750a4;padding:11px 24px;margin:8px 6px 8px 0;cursor:pointer;font-size:14px}button:disabled{opacity:.5;cursor:wait}input:not([type=checkbox]):not([type=range]),select,textarea{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid #79747e;padding:16px 4px;font:inherit;margin-bottom:12px}input[type=range]{width:100%;accent-color:#6750a4}input[type=checkbox]{accent-color:#6750a4}label{display:block;margin:12px 0;color:#49454f}article{background:#f2ecf4;border-radius:12px;padding:16px;margin:12px 0;white-space:pre-line}article p{margin:8px 0;color:#49454f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid article{text-align:center;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center}.row{display:flex;align-items:center;justify-content:space-between}#message{padding:8px;white-space:pre-line}#message:empty{display:none}h2{font-size:26px;font-weight:400}h3{font-size:20px;font-weight:400}small{display:block;color:#49454f}a{color:#6750a4}details{padding:12px;background:#f2ecf4;margin-bottom:16px}summary{cursor:pointer}.back{font-size:24px;padding:4px 12px;background:transparent;color:#1d1b20;margin:0}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#322f35;color:white;padding:14px 24px;border-radius:4px}dialog{border:0;border-radius:16px;background:#fdf7ff;max-width:90%;width:400px}@media(max-width:631px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:391px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><span id="back"></span><span id="title">SQLite Student Records</span></header><main id="app"></main><script>const $=id=>document.getElementById(id);const value=id=>$(id).value.trim();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(t){$('message').textContent=t}function card(title,text=''){return `<article><div>${esc(title)}</div><p>${esc(text)}</p></article>`}function field(id,label,type='text'){return `<label>${label}<input id="${id}" type="${type}" aria-label="${label}"></label>`}function select(id,label,options){return `<label>${label}<select id="${id}">${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`}function button(id,text){return `<button id="${id}">${text}</button>`}function shell(title,body){$('title').textContent=title;$('app').innerHTML=body+'<div id="message" role="status"></div>'}function toast(t){const n=document.createElement('div');n.id='toast';n.role='status';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),3500)}
shell('SQLite Student Records','<small>HTML version: records are saved in this browser using IndexedDB. The Dart app uses desktop SQLite.</small>'+field('roll','Roll number')+field('name','Student name')+field('course','Course')+field('cgpa','CGPA (0 to 10)','number')+button('save','Save student')+field('search','Search name or roll')+'<p id="count"></p><div id="list"></div>');$('cgpa').step='any';let database,students=[];$('save').disabled=true;function render(){const rows=students.filter(s=>(s.name+' '+s.roll).toLowerCase().includes(value('search').toLowerCase()));$('count').textContent=students.length+' students | Average CGPA: '+(students.length?students.reduce((n,s)=>n+s.cgpa,0)/students.length:0).toFixed(2);$('list').innerHTML=rows.map(s=>card(s.name+' ('+s.roll+')','Course: '+s.course+' | CGPA: '+s.cgpa)).join('')||'<p>No students found</p>'}function load(){const request=database.transaction('students').objectStore('students').getAll();request.onsuccess=()=>{students=request.result;render()};request.onerror=()=>message('Operation failed: '+request.error.message)}const opening=indexedDB.open('flutter-lab-students',1);opening.onupgradeneeded=()=>opening.result.createObjectStore('students',{keyPath:'roll'});opening.onerror=()=>message('Database could not open: '+opening.error.message);opening.onsuccess=()=>{database=opening.result;$('save').disabled=false;load()};$('search').oninput=render;$('save').onclick=()=>{const g=Number(value('cgpa'));if(!value('roll')||!value('name')||!value('course')||value('cgpa')===''||!Number.isFinite(g)||g<0||g>10)return message('Enter all fields and CGPA from 0 to 10');const tx=database.transaction('students','readwrite');tx.objectStore('students').add({roll:value('roll'),name:value('name'),course:value('course'),cgpa:g});tx.oncomplete=()=>{message('Completed successfully');load()};tx.onabort=()=>message(tx.error?.name==='ConstraintError'?'Roll number already exists':'Operation failed: '+tx.error?.message)};render();</script></body></html>
